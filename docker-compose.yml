version: '3.8'

services:
  # Aplicação React
  compras-pro-app:
    build: .
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - supabase-db
    networks:
      - compras-pro-network

  # Banco de dados PostgreSQL (simulando Supabase)
  supabase-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: compras_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - compras-pro-network

  # Supabase local (opcional - para desenvolvimento completo)
  supabase-studio:
    image: supabase/studio:latest
    ports:
      - "3001:3000"
    environment:
      SUPABASE_URL: http://localhost:8000
      SUPABASE_ANON_KEY: seu_supabase_anon_key_aqui
    restart: unless-stopped
    networks:
      - compras-pro-network

volumes:
  postgres_data:

networks:
  compras-pro-network:
    driver: bridge